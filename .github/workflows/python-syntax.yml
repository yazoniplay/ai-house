name: Python syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker requirements
        run: python -m pip install -r worker/requirements.txt
      - name: Compile Python files
        run: python -m py_compile worker/autonomous_engine.py worker/north_face.py dashboard/server.py
