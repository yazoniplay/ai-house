<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI House — A crew, not a chatbot</title>
  <desc id="desc">A dark architectural grid with a glowing house-shaped network of connected AI specialist nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#111a32"/><stop offset="1" stop-color="#17112c"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9fb2d9" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="940" cy="170" r="125" fill="#7c3aed" opacity=".17" filter="url(#soft)"/>
  <circle cx="860" cy="210" r="95" fill="#22d3ee" opacity=".13" filter="url(#soft)"/>
  <g stroke="url(#glow)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M790 130L920 82L1035 142L1010 258L870 285L790 205Z"/>
    <path d="M790 130L920 185L1035 142M920 82V185L1010 258M870 285L920 185"/>
    <path d="M920 185L790 205"/>
  </g>
  <g fill="#0d1529" stroke="url(#glow)" stroke-width="3">
    <circle cx="790" cy="130" r="11"/><circle cx="920" cy="82" r="11"/><circle cx="1035" cy="142" r="11"/>
    <circle cx="1010" cy="258" r="11"/><circle cx="870" cy="285" r="11"/><circle cx="790" cy="205" r="11"/>
    <circle cx="920" cy="185" r="18" fill="#172344"/>
  </g>
  <path d="M875 184L920 145L965 184V232H875Z" fill="#101a33" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"/>
  <path d="M907 232V199H933V232" fill="none" stroke="#67e8f9" stroke-width="3"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="76" y="88" fill="#9aa9c8" font-size="16" font-weight="700" letter-spacing="5">AUTONOMOUS BUSINESS SYSTEM</text>
    <text x="72" y="174" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="-2">AI HOUSE</text>
    <text x="76" y="222" fill="#c4b5fd" font-size="27" font-weight="600">A crew, not a chatbot.</text>
    <text x="76" y="270" fill="#aab8d0" font-size="17">Research  ·  Plan  ·  Build  ·  Review  ·  Learn</text>
    <rect x="76" y="300" width="172" height="3" rx="2" fill="url(#glow)"/>
    <text x="1080" y="326" fill="#8292b2" font-size="12" text-anchor="end" letter-spacing="2">LOCAL-FIRST • OPEN SOURCE</text>
  </g>
</svg>